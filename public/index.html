<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCT Backend API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3.5rem;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      color: #38bdf8;
      font-size: 1.75rem;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 1rem;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      margin-top: 1.25rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
      font-size: 0.875rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OCT Backend Service</h1>
    <p>Serverless API is running successfully.</p>
    <div class="status">● Active</div>
  </div>
</body>
</html>
